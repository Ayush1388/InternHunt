<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Internships, fresher roles and programs from official sources, in one place." />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23191817'/><path d='M10 22V10h2.6v12zm5.2 0V10h2.6l3.6 6.9V10H24v12h-2.6l-3.6-6.9V22z' fill='%23faf9f6'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>InternHunt</title>
    <script>
      // Apply the saved theme before first paint (no flash). Light unless the visitor picked dark.
      try {
        var dark = JSON.parse(localStorage.getItem('ih.mode') || '"light"') === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        if (dark) document.querySelector('meta[name=theme-color]').setAttribute('content', '#161514');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

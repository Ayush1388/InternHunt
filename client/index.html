<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Internships, fresher roles and programs from official sources, in one place." />
    <meta name="theme-color" content="#0f1012" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2317181b'/><path d='M10 22V10h2.6v12zm5.2 0V10h2.6l3.6 6.9V10H24v12h-2.6l-3.6-6.9V22z' fill='%23f2f2f3'/></svg>" />
    <title>InternHunt</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var t = JSON.parse(localStorage.getItem('ih.theme') || '"dark"');
        var dark = t === 'system' ? !matchMedia('(prefers-color-scheme: light)').matches : t !== 'light';
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
